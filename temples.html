<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <link rel="stylesheet" href="./styles/temples.css">
    <link rel="stylesheet" href="./styles/temples-large.css">
    <meta name="author" content="Martin Moraga" />
    <meta name="description"
        content="Hi! I'm Martin Moraga and this is a list of temples that I really like, you can find images and the name of the temples here." />
    <script src="scripts/temples.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
</head>
<body>
    <header>
        <p>Temple Album</p>
        <button type="button" id="menu" title="Hamburger button"></button>
        <nav>
            <a>Home</a>
            <a>Old</a>
            <a>New</a>
            <a>Large</a>
            <a>Small</a>
        </nav>
    </header>
    <main>
        <h1>Home</h1>
        <div class="figures">
            <figure>
                <img src="/wdd131/images/provo_temple.webp" alt="Provo Temple" />
                <figcaption>Provo Temple</figcaption>
            </figure>
            <figure>
                <img src="/wdd131/images/buenos_aires_argentina.webp" alt="Buenos Aires Temple" />
                <figcaption>Buenos Aires Temple</figcaption>
            </figure>
            <figure>
                <img src="/wdd131/images/columbus_ohio.webp" alt="Columbus Ohio Temple" />
                <figcaption>Columbus Ohio Temple</figcaption>
            </figure>
            <figure>
                <img src="/wdd131/images/curitiba_brazil.webp" alt="Curitiba Brazil Temple" />
                <figcaption>Curitiba Brazil Temple</figcaption>
            </figure>
            <figure>
                <img src="/wdd131/images/kansas_city.webp" alt="Kansas City Temple" />
                <figcaption>Kansas City Temple</figcaption>
            </figure>
            <figure>
                <img src="/wdd131/images/layton_utah.webp" alt="Layton Utah Temple" />
                <figcaption>Layton Utah Temple</figcaption>
            </figure>
            <figure>
                <img src="/wdd131/images/mcallen_texas.webp" alt="McAllen Texas Temple" />
                <figcaption>McAllen Texas Temple</figcaption>
            </figure>
            <figure>
                <img src="/wdd131/images/rome_italy.webp" alt="Rome Italy Temple" />
                <figcaption>Italy Temple</figcaption>
            </figure>
            <figure>
                <img src="/wdd131/images/salvador_brazil.webp" alt="Salvador Brazil Temple" />
                <figcaption>Salvador Brazil Temple</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <div class="general">
            <p>&copy; <span id="currentYear"></span> <br> Martin Moraga <br> Argentina</p>
        </div>
        <div class="last">
            <p>Last modification: <span id="lastModified"></span></p>
        </div>
    </footer>
</body>
</html>
